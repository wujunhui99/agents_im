Name: admin-rpc
ListenOn: 0.0.0.0:9097

# admin-rpc 数据层：task_reports + feedback 走 admin goctl model（Postgres-only）；
# 其余跨域只读全部经属主 rpc（user/agent/msg/friends），已脱顶层 internal/repository（#618）。
DataSource: ${DATABASE_URL}

# UserRPC：跨域账号只读(用户详情/搜索/计数)经属主 user-rpc（gate #550，脱 internal/repository accountRepo 的 avatar string scan）。
UserRPC:
  Endpoints:
    - user-rpc:9090
  Timeout: 5000

# AgentRPC：agent 审计 traces/dashboard 只读经属主 agent-rpc gRPC（#616，脱 internal/repository agent_audit 直读）。
AgentRPC:
  Endpoints:
    - agent-rpc:9099
  Timeout: 5000

# MsgRPC：会话消息只读(会话消息列表/用户会话/仪表盘总量) + AI 重放经属主 msg-rpc gRPC
# （#618，脱 internal/repository AdminMessageRepository + 休眠的 MessageCreatedHook）。
MsgRPC:
  Endpoints:
    - msg-rpc:9098
  Timeout: 5000

# FriendsRPC：好友关系只读经属主 friends-rpc gRPC（#618，脱 internal/repository FriendshipRepository）。
FriendsRPC:
  Endpoints:
    - friends-rpc:9092
  Timeout: 5000

# go-zero 自带 tracing：endpoint 由 ConfigMap 注入的 AGENTS_IM_OTLP_ENDPOINT 提供（空则关闭）。
Telemetry:
  Name: admin-rpc
  Endpoint: ${AGENTS_IM_OTLP_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
