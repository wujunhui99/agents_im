Name: apigateway
Host: 0.0.0.0
Port: 8080

# 单一 HTTP 入口：8 个原 *-api 域在同一个进程内装配，共用同一 JWT secret / Redis 会话。
Auth:
  AccessSecret: ${JWT_ACCESS_SECRET}
  AccessExpire: 86400

User:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  UserRPC:
    Endpoints:
      - user-rpc:9090
    Timeout: 5000
  Redis:
    Addr: ${REDIS_ADDR}
    Password: ${REDIS_PASSWORD}
    DB: ${REDIS_DB}

AuthAPI:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  AuthRPC:
    Endpoints:
      - auth-rpc:9091
    Timeout: 5000

Friends:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  FriendsRPC:
    Target: dns:///friends-rpc:9092
    Timeout: 5000
  UserRPC:
    Endpoints:
      - user-rpc:9090
    Timeout: 5000
  Redis:
    Addr: ${REDIS_ADDR}
    Password: ${REDIS_PASSWORD}
    DB: ${REDIS_DB}

Groups:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  GroupsRPC:
    Target: dns:///groups-rpc:9103
    Timeout: 5000
  UserRPC:
    Endpoints:
      - user-rpc:9090
    Timeout: 5000
  Redis:
    Addr: ${REDIS_ADDR}
    Password: ${REDIS_PASSWORD}
    DB: ${REDIS_DB}

Msg:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  MsgRPC:
    Target: dns:///msg-rpc:9098
    Timeout: 5000
  AdminRPC:
    Target: dns:///admin-rpc:9097
    Timeout: 5000
  AgentRPC:
    Target: dns:///agent-rpc:9099
    Timeout: 5000
  Redis:
    Addr: ${REDIS_ADDR}
    Password: ${REDIS_PASSWORD}
    DB: ${REDIS_DB}

Agent:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  AgentRPC:
    Endpoints:
      - agent-rpc:9099
    Timeout: 5000
  Redis:
    Addr: ${REDIS_ADDR}
    Password: ${REDIS_PASSWORD}
    DB: ${REDIS_DB}

Admin:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  AdminRPC:
    Target: dns:///admin-rpc:9097
    Timeout: 5000
  UserRPC:
    Endpoints:
      - user-rpc:9090
    Timeout: 5000
  AuthRPC:
    Endpoints:
      - auth-rpc:9091
    Timeout: 5000
  Redis:
    Addr: ${REDIS_ADDR}
    Password: ${REDIS_PASSWORD}
    DB: ${REDIS_DB}

Media:
  Auth:
    AccessSecret: ${JWT_ACCESS_SECRET}
    AccessExpire: 86400
  ResourceRPC:
    Endpoints:
      - resource-rpc:9096
    Timeout: 5000
  MsgRPC:
    Endpoints:
      - msg-rpc:9098
    Timeout: 5000
  FriendsRPC:
    Endpoints:
      - friends-rpc:9092
    Timeout: 5000
  GroupsRPC:
    Endpoints:
      - groups-rpc:9103
    Timeout: 5000

Telemetry:
  Name: apigateway
  Endpoint: ${AGENTS_IM_OTLP_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
