Name: user-rpc
ListenOn: 0.0.0.0:9090

JWTAuth:
  AccessSecret: dev-jwt-secret-change-me
  AccessExpire: 86400
DataSource: ${DATABASE_URL}

# MediaRPC：头像 media 校验经属主 media-rpc（#533）。
ResourceRPC:
  Endpoints:
    - 127.0.0.1:9096
  Timeout: 5000

# 事件出口：新账号创建后发布 user.created.v1（默认助手绑定/好友由 agent-rpc 消费）。
Kafka:
  Brokers: ${KAFKA_BROKERS}

Telemetry:
  Name: user-rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc
