Name: admin-rpc
ListenOn: 0.0.0.0:9097

# admin-rpc 数据层：task_reports + feedback 走 admin goctl model（Postgres-only）；
# 其余跨域只读全部经属主 rpc（user/agent/msg/friends），已脱顶层 internal/repository（#618）。
DataSource: ${DATABASE_URL}

Telemetry:
  Name: admin-rpc
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc
