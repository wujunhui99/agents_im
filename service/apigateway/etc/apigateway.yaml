Name: apigateway
Host: 0.0.0.0
Port: 8080

# 单一 HTTP 入口：每个域保留自己的配置（RPC 客户端 / Redis / 域开关）。
# JWT 校验与 jti 会话校验仍按域路由组生效，但都在本进程内、共用同一 secret 与 Redis。

User:
  Auth:
    AccessSecret: dev-jwt-secret-change-me
    AccessExpire: 86400
  UserRPC:
    Endpoints:
      - 127.0.0.1:9090
    Timeout: 5000
  Redis:
    Addr: localhost:6379
    Password: ""
    DB: 0

AuthAPI:
  Auth:
    AccessSecret: dev-jwt-secret-change-me
    AccessExpire: 86400
  AuthRPC:
    Endpoints:
      - 127.0.0.1:9091
    Timeout: 5000

